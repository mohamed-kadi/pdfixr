<section class="panel">
  <div class="section-head">
    <h2>Audit Status</h2>
    <button class="ghost" type="button" [disabled]="loading" (click)="refreshAuditLogs()">
      {{ loading ? 'Refreshing...' : 'Refresh Audit' }}
    </button>
  </div>
  <p class="status" [ngClass]="statusStyle">{{ statusMessage }}</p>
</section>

<section class="panel">
  <div class="section-head">
    <h2>Global Audit Logs</h2>
    <button class="ghost" type="button" [disabled]="loading" (click)="refreshAuditLogs()">Refresh Audit</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Action</th>
          <th>Workspace</th>
          <th>Actor</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="auditLogs.length === 0">
          <td colspan="5" class="empty">No audit logs yet.</td>
        </tr>
        <tr *ngFor="let log of auditLogs; trackBy: trackByAuditId">
          <td>{{ formatDate(log.created_at) }}</td>
          <td><code>{{ log.action }}</code></td>
          <td>{{ log.workspace_id ? (log.workspace_id | slice:0:8) : '-' }}</td>
          <td>{{ log.actor_type }}:{{ log.actor_id }}</td>
          <td><code [title]="log.details | json">{{ detailsPreview(log.details) }}</code></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
