<div class="ambient ambient-left"></div>
<div class="ambient ambient-right"></div>

<main class="layout auth-layout">
  <section class="hero">
    <p class="eyebrow">Account Recovery</p>
    <h1>Reset password</h1>
    <p>Paste your reset token and set a new password for your account.</p>
    <p class="top-links">
      <a routerLink="/forgot-password">Request a new token</a>
      <span> | </span>
      <a routerLink="/sign-in">Back to Sign In</a>
    </p>
  </section>

  <section class="panel auth-panel">
    <h2>Set New Password</h2>
    <form class="upload-form" (ngSubmit)="submit()">
      <label for="reset-token" class="input-label">Reset Token</label>
      <textarea
        id="reset-token"
        rows="3"
        placeholder="Paste token"
        [(ngModel)]="token"
        name="token"
        required
      ></textarea>

      <label for="new-password" class="input-label">New Password</label>
      <input
        id="new-password"
        type="password"
        placeholder="Enter new password"
        [(ngModel)]="newPassword"
        name="newPassword"
        minlength="8"
        autocomplete="new-password"
        required
      />

      <label for="confirm-password" class="input-label">Confirm New Password</label>
      <input
        id="confirm-password"
        type="password"
        placeholder="Repeat new password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        required
      />

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>
    <p class="status" [ngClass]="statusStyle">{{ statusMessage }}</p>
  </section>
</main>
