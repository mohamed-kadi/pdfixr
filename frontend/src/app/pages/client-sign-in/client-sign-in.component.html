<div class="ambient ambient-left"></div>
<div class="ambient ambient-right"></div>

<main class="layout auth-layout">
  <section class="panel auth-panel client-auth-panel">
    <h2>Welcome back</h2>
    <p class="signin-subtitle">Sign in to your account</p>
    <p class="signin-intent" *ngIf="requestedOperationLabel">
      You selected: {{ requestedOperationLabel }}. Sign in to continue.
    </p>
    <form class="upload-form" (ngSubmit)="signIn()">
      <label for="client-email" class="input-label">Email</label>
      <input
        id="client-email"
        type="email"
        placeholder="you@company.com"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        required
      />

      <label for="client-password" class="input-label">Password</label>
      <div class="password-row">
        <input
          id="client-password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <button
          *ngIf="password.trim().length > 0"
          type="button"
          class="ghost tiny-btn"
          (click)="toggleShowPassword()"
        >
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>
      <div class="password-meta">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    <p class="status" [ngClass]="statusStyle">{{ statusMessage }}</p>
    <div class="auth-footer">
      <p class="footer-copy">
        New here?
        <a routerLink="/sign-up">Sign up</a>
      </p>
      <a routerLink="/" class="home-link">Back to Home</a>
    </div>
  </section>
</main>
